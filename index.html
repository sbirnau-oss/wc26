<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>WC26 Squad Browser</title>
<style>
:root{
  --bg:#12141c; --panel:#1d2029; --panel2:#232734; --line:#2e3342;
  --txt:#dfe3ec; --dim:#8b92a5; --accent:#8b5cf6; --teal:#2dd4a8;
  --gold:#d8a629; --gk:#d8a629; --df:#43a364; --mf:#3f8fd1; --fw:#cf4d4d;
  --val:#5dd87a; --hot:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
.flag{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}

/* ===== header ===== */
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#1a1230,#161925 70%);border-bottom:2px solid var(--accent);padding:10px 14px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:17px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800}
.brand h1 b{color:var(--accent)}
.brand .sub{color:var(--dim);font-size:11px;letter-spacing:1px}
nav{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:#fff;border-color:var(--teal)}
.searchwrap{padding:10px 0}
.searchwrap input{width:100%;max-width:420px;background:#0e1018;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:9px 12px;font-size:14px;outline:none}
.searchwrap input:focus{border-color:var(--accent)}

main{max-width:1060px;margin:0 auto;padding:14px 10px 60px}

/* ===== paneluri ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.panel>h2{background:var(--panel2);padding:9px 12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.panel>h2 b{color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}

/* ===== randuri echipe ===== */
.trow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #262a37;cursor:pointer}
.trow:last-child{border-bottom:none}
.trow:hover{background:#262b3a}
.trow .flag{font-size:21px;width:30px;text-align:center}
.trow .nm{flex:1;font-weight:600;font-size:13.5px}
.trow .nm small{display:block;color:var(--dim);font-weight:400;font-size:10.5px}
.trow .elo{font-size:12px;color:var(--dim);width:44px;text-align:right}
.trow .mv{font-size:12.5px;color:var(--val);font-weight:700;width:72px;text-align:right}
.gbadge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:4px;letter-spacing:1px}
.hostbadge{display:inline-block;background:#3f4252;color:#ffd76a;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.5px}

/* ===== tabele ===== */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{background:var(--panel2);color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;padding:8px 8px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right}
th .arr{color:var(--teal)}
td{padding:7px 8px;border-bottom:1px solid #262a37;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:#262b3a}
tbody tr:nth-child(even){background:#20242f}
tbody tr:nth-child(even):hover{background:#262b3a}
.pname{font-weight:600}
.pname .cpt{color:var(--gold);font-weight:800}
.dimc{color:var(--dim);font-size:12px}
.valc{color:var(--val);font-weight:700}
.mvbar{display:inline-block;height:4px;background:linear-gradient(90deg,var(--teal),var(--val));border-radius:2px;vertical-align:middle;margin-left:6px;min-width:2px}

/* badge pozitie */
.pos{display:inline-block;min-width:30px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:2px 5px;border-radius:4px;color:#fff}
.pos.GK{background:var(--gk);color:#1a1505}.pos.DF{background:var(--df)}.pos.MF{background:var(--mf)}.pos.FW{background:var(--fw)}

/* ===== pagina echipa ===== */
.teamhead{display:flex;align-items:center;gap:14px;padding:16px 14px;flex-wrap:wrap}
.teamhead .flag{font-size:52px;line-height:1}
.teamhead h2{font-size:22px;font-weight:800;letter-spacing:.5px}
.teamhead .meta{color:var(--dim);font-size:12.5px;margin-top:3px}
.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));border-top:1px solid var(--line)}
.statbar .cell{padding:10px 12px;border-right:1px solid #262a37}
.statbar .cell:last-child{border-right:none}
.statbar .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.statbar .v{font-size:16.5px;font-weight:800;margin-top:2px}
.statbar .v.val{color:var(--val)}
.backlink{display:inline-block;color:var(--teal);font-size:12.5px;font-weight:700;margin-bottom:10px;cursor:pointer;letter-spacing:1px}

/* ===== filtre jucatori ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.filters select,.filters button{background:#0e1018;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 10px;font-size:12.5px}
.chip{background:#0e1018;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.morebtn{display:block;width:100%;padding:11px;background:var(--panel2);border:none;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;letter-spacing:1px}

/* ===== topuri ===== */
.toplist{counter-reset:rk}
.toplist .trow{counter-increment:rk}
.toplist .trow::before{content:counter(rk);color:var(--dim);font-size:11px;width:18px;font-weight:700}
.hbar{height:6px;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:3px;margin-top:4px}

/* XI valoric */
.pitch{background:linear-gradient(180deg,#14532d,#166534 45%,#14532d);border-radius:10px;padding:18px 6px;display:flex;flex-direction:column;gap:14px;border:1px solid #1f7a45}
.pitchrow{display:flex;justify-content:space-evenly}
.pp{text-align:center;width:76px}
.pp .dot{width:40px;height:40px;border-radius:50%;background:#0e1018;border:2px solid var(--teal);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:19px}
.pp .n{font-size:10.5px;font-weight:700;margin-top:4px;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .v{font-size:10px;color:#b7f7c9;font-weight:700}

/* ===== meciuri ===== */
.dayhead{padding:10px 12px 4px;color:var(--teal);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
.mrow{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid #262a37}
.mrow:last-child{border-bottom:none}
.mrow .when{width:46px;color:var(--dim);font-size:11px;text-align:center;line-height:1.3}
.mrow .stg{min-width:26px;text-align:center}
.mrow .t{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;cursor:pointer}
.mrow .t.right{justify-content:flex-end;text-align:right}
.mrow .sc{min-width:52px;text-align:center;font-weight:800;font-size:14.5px;background:#0e1018;border-radius:6px;padding:4px 6px}
.mrow .sc.live{color:var(--teal)}
.mrow .sc.fut{color:var(--dim);font-weight:600;font-size:11px}
.mrow.today{background:#1c2a2a}
.scorers{padding:2px 12px 9px 64px;color:var(--dim);font-size:11px;border-bottom:1px solid #262a37}
.scorers b{color:var(--txt);font-weight:600}
/* clasament grupe */
.sttbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
.sttbl th{padding:6px 6px;cursor:default;position:static}
.sttbl td{padding:6px 6px}
.sttbl .q1{border-left:3px solid var(--teal)}
.sttbl .q3{border-left:3px solid var(--gold)}
.sttbl tbody tr{cursor:pointer}
.sttbl .tn{font-weight:700;white-space:nowrap}
.sttbl .pts{font-weight:800;color:var(--teal)}

/* ===== modal jucator ===== */
.overlay{position:fixed;inset:0;background:rgba(5,6,10,.72);z-index:90;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
@media(min-width:640px){.pcard{border-radius:14px}}
.pchead{background:linear-gradient(135deg,#241a45,#1a2335);padding:18px 16px;display:flex;gap:13px;align-items:center;border-bottom:2px solid var(--accent)}
.pchead .flag{font-size:40px}
.pchead h3{font-size:19px;font-weight:800}
.pchead .sub{color:var(--dim);font-size:12px;margin-top:2px}
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#262a37}
.pcell{background:var(--panel);padding:11px 14px}
.pcell .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.pcell .v{font-size:15px;font-weight:700;margin-top:2px}
.pcell .v.big{font-size:19px;color:var(--val)}
.pcclose{display:block;width:100%;padding:13px;background:var(--panel2);color:var(--dim);border:none;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px}
.mvbigbar{height:7px;background:#0e1018;border-radius:4px;margin-top:6px;overflow:hidden}
.mvbigbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--val));border-radius:4px}

footer{text-align:center;color:#5a6072;font-size:11px;padding:18px 12px 26px;line-height:1.7}
@media(max-width:640px){
  .hidemob{display:none}
  table{min-width:0;font-size:12.5px}
  td,th{padding:7px 6px}
}
</style>
</head>

/* ===== utilitare ===== */
const $=(s,el)=>(el||document).querySelector(s);
const POSORD={GK:0,DF:1,MF:2,FW:3};
const POSRO={GK:"Portar",DF:"Fundaș",MF:"Mijlocaș",FW:"Atacant"};
const FOOTRO={left:"stâng",right:"drept",both:"ambele"};
const deacc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function fmtMV(v){
  if(v==null)return "–";
  if(v>=1e9)return "€"+(v/1e9).toFixed(2)+"mld";
  if(v>=1e6){const m=v/1e6;return "€"+(m>=100?m.toFixed(0):m>=10?m.toFixed(1):m.toFixed(2)).replace(".",",")+"m";}
  return "€"+Math.round(v/1e3)+"k";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* pregatire date */
const TEAMS=WC26.teams.slice().sort((a,b)=>a.group===b.group?b.elo-a.elo:a.group<b.group?-1:1);
const ALL=[];
TEAMS.forEach(t=>t.players.forEach(p=>{p._t=t;ALL.push(p);}));
const MAXMV=Math.max(...ALL.map(p=>p.mv||0));
const MAXTMV=Math.max(...TEAMS.map(t=>t.totalMV));
TEAMS.forEach(t=>{t.avgAge=(t.players.reduce((s,p)=>s+p.age,0)/t.players.length);});

/* ===== rutare ===== */
window.addEventListener("hashchange",render);
function go(h){location.hash=h;}
function render(){
  const h=location.hash||"#/";
  let view="echipe";
  if(h.startsWith("#/jucatori"))view="jucatori";
  else if(h.startsWith("#/topuri"))view="topuri";
  else if(h.startsWith("#/meciuri"))view="meciuri";
  else if(h.startsWith("#/grupe"))view="grupe";
  else if(h.startsWith("#/echipa/"))view="echipa";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===view||(view==="echipa"&&a.dataset.v==="echipe")));
  const app=$("#app");
  if(view==="echipe")app.innerHTML=vEchipe();
  else if(view==="echipa")app.innerHTML=vEchipa(decodeURIComponent(h.slice(9)));
  else if(view==="jucatori"){app.innerHTML=vJucatori();bindJucatori();}
  else if(view==="meciuri")app.innerHTML=vMeciuri();
  else if(view==="grupe")app.innerHTML=vGrupe();
  else app.innerHTML=vTopuri();
  window.scrollTo(0,0);
}

/* ===== vedere: echipe pe grupe ===== */
function teamRow(t){
  return `<div class="trow" onclick="go('#/echipa/${encodeURIComponent(t.team)}')">
    <span class="flag">${t.flag}</span>
    <span class="nm">${esc(t.team)}${t.host?' <span class="hostbadge">GAZDĂ</span>':''}<small>${esc(t.coach||"")}</small></span>
    <span class="elo">${t.elo}</span><span class="mv">${fmtMV(t.totalMV)}</span></div>`;
}
function vEchipe(){
  const groups={};
  TEAMS.forEach(t=>(groups[t.group]=groups[t.group]||[]).push(t));
  return `<div class="grid">`+Object.keys(groups).sort().map(g=>
    `<div class="panel"><h2>Grupa <b>${g}</b></h2>${groups[g].map(teamRow).join("")}</div>`).join("")+`</div>
    <div class="panel"><h2>Legendă</h2><div style="padding:10px 12px" class="dimc">Pe rând: echipă &middot; selecționer &middot; rating Elo &middot; valoarea de piață a lotului. Atinge o echipă pentru lot complet.</div></div>`;
}

/* ===== vedere: o echipa ===== */
let sortKey="posno",sortDir=1,curTeam=null;
function sortPlayers(ps){
  const k=sortKey,d=sortDir;
  return ps.slice().sort((a,b)=>{
    if(k==="posno"){const c=POSORD[a.pos]-POSORD[b.pos];return c||((+a.no||99)-(+b.no||99));}
    if(k==="name")return d*a.name.localeCompare(b.name);
    if(k==="club")return d*String(a.club).localeCompare(String(b.club));
    return d*(((b[k]==null?-1:b[k]))-((a[k]==null?-1:a[k])));
  });
}
function setSort(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1;}render();}
function rosterTable(ps,withTeam){
  const arr=k=>sortKey===k?` <span class="arr">${sortDir>0?"▼":"▲"}</span>`:"";
  return `<div class="tablewrap"><table><thead><tr>
    ${withTeam?"<th>Echipă</th>":`<th onclick="setSort('posno')">#${arr("posno")}</th>`}
    <th onclick="setSort('posno')">Pos${arr("posno")}</th>
    <th onclick="setSort('name')">Nume${arr("name")}</th>
    <th class="num" onclick="setSort('age')">Vârstă${arr("age")}</th>
    <th class="num" onclick="setSort('caps')">Sel${arr("caps")}</th>
    <th class="num" onclick="setSort('goals')">Gol${arr("goals")}</th>
    <th onclick="setSort('club')">Club${arr("club")}</th>
    <th class="num" onclick="setSort('mv')">Cotă${arr("mv")}</th>
  </tr></thead><tbody>`+
  sortPlayers(ps).map(p=>{
    const bar=p.mv?`<span class="mvbar" style="width:${Math.round(34*Math.sqrt(p.mv/MAXMV))}px"></span>`:"";
    return `<tr onclick="openP('${esc(p._t.team)}','${esc(p.name).replace(/'/g,"\\'")}')">
    ${withTeam?`<td><span class="flag">${p._t.flag}</span> <span class="dimc hidemob">${esc(p._t.team)}</span></td>`:`<td class="dimc">${p.no||"–"}</td>`}
    <td><span class="pos ${p.pos}">${p.pos}</span></td>
    <td class="pname">${esc(p.name)}${p.cap?' <span class="cpt">©</span>':''}</td>
    <td class="num">${p.age}</td><td class="num">${p.caps}</td><td class="num">${p.goals||"–"}</td>
    <td class="dimc"><span class="flag">${p.ccFlag||""}</span> ${esc(p.club||"–")}</td>
    <td class="num valc">${fmtMV(p.mv)}${bar}</td></tr>`;
  }).join("")+`</tbody></table></div>`;
}

  return `<span class="backlink" onclick="history.back()">‹ ÎNAPOI</span>
  <div class="panel">
    <div class="teamhead"><span class="flag">${t.flag}</span>

      <div class="meta">Selecționer: <b>${esc(t.coach||"?")}</b> &middot; Căpitan: <b>${esc((t.players.find(p=>p.cap)||{}).name||"?")}</b></div></div></div>
    <div class="statbar">
      <div class="cell"><div class="k">Valoare lot</div><div class="v val">${fmtMV(t.totalMV)}</div></div>
      <div class="cell"><div class="k">Rating Elo</div><div class="v">${t.elo}</div></div>
      <div class="cell"><div class="k">Vârstă medie</div><div class="v">${t.avgAge.toFixed(1)}</div></div>
      <div class="cell"><div class="k">Cel mai valoros</div><div class="v" style="font-size:13px">${esc(stars[0].name)}<br><span class="valc">${fmtMV(stars[0].mv)}</span></div></div>
    </div>
  </div>
  <div class="panel"><h2>Lot oficial &middot; <b>26 jucători</b></h2>${rosterTable(t.players,false)}</div>
  ${RES.length?`<div class="panel"><h2>Meciurile echipei</h2>${RES.filter(m=>m.t1===t.team||m.t2===t.team).sort((a,b)=>sortKeyM(a).localeCompare(sortKeyM(b))).map(m=>`<div class="dayhead">${roDay(matchDateRO(m))}</div>`+matchRow(m,false)).join("")}</div>
  <div class="panel"><h2>Clasament Grupa ${t.group}</h2>${standingsTable(t.group)}</div>`
  :`<div class="panel"><h2>Grupa ${t.group}</h2>${grp.map(teamRow).join("")}</div>`}`;
}

/* ===== vedere: toti jucatorii ===== */
let fQ="",fPos="",fTeam="",pLimit=100;
function vJucatori(){
  let ps=ALL;
  if(fPos)ps=ps.filter(p=>p.pos===fPos);
  if(fTeam)ps=ps.filter(p=>p._t.team===fTeam);
  if(fQ){const q=deacc(fQ);ps=ps.filter(p=>deacc(p.name).includes(q)||deacc(p.club||"").includes(q));}
  if(sortKey==="posno"){sortKey="mv";sortDir=1;}
  const shown=sortPlayers(ps).slice(0,pLimit);
  const chips=["","GK","DF","MF","FW"].map(c=>`<span class="chip ${fPos===c?"on":""}" onclick="fPos='${c}';pLimit=100;render()">${c||"Toate"}</span>`).join("");
  return `<div class="panel">
    <div class="filters">
      <input id="psearch" placeholder="Caută jucător sau club…" value="${esc(fQ)}" style="flex:1;min-width:150px;background:#0e1018;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:7px 10px">
      ${chips}
      <select id="pteam" onchange="fTeam=this.value;pLimit=100;render()">
        <option value="">Toate echipele</option>
        ${TEAMS.slice().sort((a,b)=>a.team.localeCompare(b.team)).map(t=>`<option ${fTeam===t.team?"selected":""}>${esc(t.team)}</option>`).join("")}
      </select>
    </div>
    <h2>${ps.length} jucători ${fQ||fPos||fTeam?"(filtrat)":""} &middot; <b>sortare: atinge coloana</b></h2>
    ${rosterTable(shown,true)}
    ${ps.length>pLimit?`<button class="morebtn" onclick="pLimit+=200;render()">ARATĂ ÎNCĂ 200 (din ${ps.length})</button>`:""}
  </div>`;
}
function bindJucatori(){
  const inp=$("#psearch");
  inp.addEventListener("input",()=>{fQ=inp.value;pLimit=100;
    clearTimeout(window.__qt);window.__qt=setTimeout(()=>{const pos=inp.selectionStart;render();const ni=$("#psearch");ni.focus();ni.setSelectionRange(pos,pos);},220);});
}

function valueXI(){
  const by=pos=>ALL.filter(p=>p.pos===pos).sort((a,b)=>(b.mv||0)-(a.mv||0));
  const rows=[[by("FW").slice(0,3)],[by("MF").slice(0,3)],[by("DF").slice(0,4)],[by("GK").slice(0,1)]];
  return `<div class="panel"><h2>XI-ul de <b>aur</b> (după cota de piață)</h2><div style="padding:12px"><div class="pitch">${
    rows.map(([ps])=>`<div class="pitchrow">${ps.map(p=>`<div class="pp" onclick="openP('${esc(p._t.team)}','${esc(p.name).replace(/'/g,"\\'")}')"><div class="dot"><span class="flag">${p._t.flag}</span></div><div class="n">${esc(p.name.split(" ").slice(-1)[0])}</div><div class="v">${fmtMV(p.mv)}</div></div>`).join("")}</div>`).join("")
  }</div></div></div>`;
}
function vTopuri(){
  const byMV=ALL.slice().sort((a,b)=>(b.mv||0)-(a.mv||0));
  const byCaps=ALL.slice().sort((a,b)=>b.caps-a.caps);
  const byGoals=ALL.slice().sort((a,b)=>b.goals-a.goals);
  const young=ALL.slice().sort((a,b)=>a.dob<b.dob?1:-1);
  const old=ALL.slice().sort((a,b)=>a.dob>b.dob?1:-1);
  const teamsMV=TEAMS.slice().sort((a,b)=>b.totalMV-a.totalMV);
  const clubs={};
  ALL.forEach(p=>{if(!p.club)return;const c=clubs[p.club]=clubs[p.club]||{n:0,mv:0,flag:p.ccFlag};c.n++;c.mv+=p.mv||0;});
  const topClubs=Object.entries(clubs).sort((a,b)=>b[1].n-a[1].n||b[1].mv-a[1].mv).slice(0,15);
  const golg=golgheteri();
  const golgPanel=golg.length?topList("Golgheterii <b>turneului</b>",golg,s=>{
    const t=TEAMBY[s.team]||{flag:""};
    const sq=t.players?t.players.find(p=>deacc(p.name)===deacc(s.full)||deacc(p.name).includes(deacc(s.n))):null;
    const open=sq?` onclick="openP('${esc(t.team)}','${esc(sq.name).replace(/'/g,"\\'")}')"`:"";
    return `<div class="trow"${open}><span class="flag">${t.flag}</span><span class="nm">${esc(s.full)}<small>${esc(s.team)}</small></span><span class="mv">${s.g} gol${s.g>1?"uri":""}</span></div>`;
  }):"";
  return valueXI()
  +`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">`
  +golgPanel
  +topList("Echipe după <b>valoarea lotului</b>",teamsMV.slice(0,12),t=>
     `<div class="trow" onclick="go('#/echipa/${encodeURIComponent(t.team)}')"><span class="flag">${t.flag}</span>
      <span class="nm">${esc(t.team)}<div class="hbar" style="width:${Math.round(100*t.totalMV/MAXTMV)}%"></div></span>
      <span class="mv">${fmtMV(t.totalMV)}</span></div>`)
  +topList("Top <b>cote de piață</b>",byMV.slice(0,15),p=>prow(p,fmtMV(p.mv)))
  +topList("Top <b>selecții</b>",byCaps.slice(0,15),p=>prow(p,p.caps))
  +topList("Top <b>golgheteri</b> la națională",byGoals.slice(0,15),p=>prow(p,p.goals))
  +topList("Cei mai <b>tineri</b>",young.slice(0,10),p=>prow(p,p.age+" ani"))
  +topList("Cei mai <b>experimentați</b>",old.slice(0,10),p=>prow(p,p.age+" ani"))
  +topList("Cluburi cu <b>cei mai mulți</b> jucători",topClubs,([c,o])=>
     `<div class="trow"><span class="flag">${o.flag||""}</span><span class="nm">${esc(c)}<small>${fmtMV(o.mv)} total</small></span><span class="mv">${o.n}</span></div>`)
  +`</div>`;
}

/* ===== rezultate & clasamente ===== */
const RES=(WC26.results&&WC26.results.matches)?WC26.results.matches:[];
const TEAMBY={};TEAMS.forEach(t=>TEAMBY[t.team]=t);
const ZILE=["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const LUNI=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
function roDay(iso){const d=new Date(iso+"T12:00:00");return ZILE[d.getDay()]+" "+d.getDate()+" "+LUNI[d.getMonth()];}
function dloc(m){return m.utc?new Date(m.utc.replace(" ","T")+":00Z"):null;}
const p2=n=>String(n).padStart(2,"0");
function matchDateRO(m){const d=dloc(m);return d?d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()):m.date;}
function matchTimeRO(m){const d=dloc(m);return d?p2(d.getHours())+":"+p2(d.getMinutes()):"";}
function sortKeyM(m){return matchDateRO(m)+" "+(matchTimeRO(m)||"99");}
function teamCell(name,right){
  const t=TEAMBY[name];
  const fl=t?`<span class="flag">${t.flag}</span>`:"";
  const nm=`<span>${esc(name||"?")}</span>`;
  const go=t?` onclick="go('#/echipa/${encodeURIComponent(t.team)}')"`:"";
  return `<span class="t ${right?'right':''}"${go}>${right?nm+fl:fl+nm}</span>`;
}
function stageBadge(m){
  if(m.stage&&m.stage.startsWith("Grupa "))return `<span class="gbadge" style="background:#3f4252">${m.stage.slice(6)}</span>`;
  return `<span class="gbadge">${esc((m.stage||"?").slice(0,12))}</span>`;
}
function matchRow(m,today){
  const played=!!m.score;
  let sc;
  if(played){
    let s=m.score[0]+"–"+m.score[1];
    if(m.pen)s+=` <small>(${m.pen[0]}–${m.pen[1]} pen)</small>`;
    else if(m.aet)s+=" <small>(prel)</small>";
    sc=`<span class="sc">${s}</span>`;
  } else sc=`<span class="sc fut">${matchTimeRO(m)||"vs"}</span>`;
  const scorers=(m.scorers1||[]).concat(m.scorers2||[]);
  const scline=played&&scorers.length?`<div class="scorers">⚽ ${scorers.map(s=>`<b>${esc(s.name)}</b>${s.g>1?" ×"+s.g:""}`).join(", ")}</div>`:"";
  return `<div class="mrow ${today?'today':''}">
    <span class="when">${matchTimeRO(m)||""}</span>${stageBadge(m)}
    ${teamCell(m.t1,true)}${sc}${teamCell(m.t2,false)}</div>${scline}`;
}
let fMec="toate";
function vMeciuri(){
  if(!RES.length)return `<div class="panel"><h2>Meciuri</h2><div style="padding:14px" class="dimc">Rezultatele nu sunt încă încărcate — rulează update_results.py.</div></div>`;
  const n=new Date(), tod=n.getFullYear()+"-"+p2(n.getMonth()+1)+"-"+p2(n.getDate()); // azi, ora locală
  let ms=RES.slice().filter(m=>m.t1&&m.t2);
  if(fMec==="jucate")ms=ms.filter(m=>m.score);
  if(fMec==="program")ms=ms.filter(m=>!m.score);
  if(fMec==="azi")ms=ms.filter(m=>matchDateRO(m)===tod);
  ms.sort((a,b)=>sortKeyM(a).localeCompare(sortKeyM(b)));
  const byday={};
  ms.forEach(m=>{const d=matchDateRO(m)||"?";(byday[d]=byday[d]||[]).push(m);});
  const chips=[["toate","Toate"],["azi","Azi"],["jucate","Jucate"],["program","Program"]].map(([k,l])=>
    `<span class="chip ${fMec===k?"on":""}" onclick="fMec='${k}';render()">${l}</span>`).join("");
  const played=RES.filter(m=>m.score).length;
  return `<div class="panel"><div class="filters">${chips}<span class="dimc" style="padding:6px 0">${played} jucate &middot; ore în fusul tău</span></div>
  ${Object.keys(byday).sort().map(d=>`<div class="dayhead">${roDay(d)}</div>`+byday[d].map(m=>matchRow(m,d===tod)).join("")).join("")}</div>`;
}
function standingsFor(g){
  const rows={};
  TEAMS.filter(t=>t.group===g).forEach(t=>rows[t.team]={team:t.team,m:0,v:0,e:0,i:0,gf:0,ga:0,pts:0});
  RES.filter(m=>m.stage==="Grupa "+g&&m.score&&rows[m.t1]&&rows[m.t2]).forEach(m=>{
    const[a,b]=m.score,r1=rows[m.t1],r2=rows[m.t2];
    r1.m++;r2.m++;r1.gf+=a;r1.ga+=b;r2.gf+=b;r2.ga+=a;
    if(a>b){r1.v++;r2.i++;r1.pts+=3;}else if(a<b){r2.v++;r1.i++;r2.pts+=3;}else{r1.e++;r2.e++;r1.pts++;r2.pts++;}
  });
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.team.localeCompare(y.team));
}
function standingsTable(g){
  const st=standingsFor(g);
  return `<table class="sttbl"><thead><tr><th>#</th><th>Echipă</th><th class="num">M</th><th class="num">V</th><th class="num">E</th><th class="num">Î</th><th class="num">Gol</th><th class="num">Pct</th></tr></thead><tbody>${
    st.map((r,i)=>{const t=TEAMBY[r.team];return `<tr class="${i<2?'q1':i===2?'q3':''}" onclick="go('#/echipa/${encodeURIComponent(r.team)}')">
      <td class="dimc">${i+1}</td><td class="tn"><span class="flag">${t.flag}</span> ${esc(r.team)}</td>
      <td class="num">${r.m}</td><td class="num">${r.v}</td><td class="num">${r.e}</td><td class="num">${r.i}</td>
      <td class="num dimc">${r.gf}–${r.ga}</td><td class="num pts">${r.pts}</td></tr>`;}).join("")
  }</tbody></table>`;
}
function vGrupe(){
  if(!RES.length)return vEchipe();
  return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">`+
    "ABCDEFGHIJKL".split("").map(g=>{
      const ms=RES.filter(m=>m.stage==="Grupa "+g).sort((a,b)=>sortKeyM(a).localeCompare(sortKeyM(b)));
      return `<div class="panel"><h2>Grupa <b>${g}</b></h2>${standingsTable(g)}${ms.map(m=>matchRow(m,false)).join("")}</div>`;
    }).join("")+`</div>
    <div class="panel"><h2>Calificare</h2><div style="padding:10px 12px" class="dimc">
    <span style="color:var(--teal)">▎</span>primele 2 merg în șaisprezecimi &middot; <span style="color:var(--gold)">▎</span>locul 3 — se califică cele mai bune 8 din 12 &middot; clasament: puncte, golaveraj, goluri marcate (fără criterii H2H)</div></div>`;
}
function golgheteri(){
  const agg={};
  RES.forEach(m=>{
    (m.scorers1||[]).forEach(s=>{const k=s.full;agg[k]=agg[k]||{n:s.name,full:s.full,team:m.t1,g:0};agg[k].g+=s.g;});
    (m.scorers2||[]).forEach(s=>{const k=s.full;agg[k]=agg[k]||{n:s.name,full:s.full,team:m.t2,g:0};agg[k].g+=s.g;});
  });
  return Object.values(agg).sort((a,b)=>b.g-a.g).slice(0,15);
}

/* ===== modal jucator ===== */
function openP(team,name){
  const t=TEAMS.find(x=>x.team===team);
  const p=t&&t.players.find(x=>x.name===name);
  if(!p)return;
  const pct=p.mv?Math.max(2,Math.round(100*Math.sqrt(p.mv/MAXMV))):0;
  const div=document.createElement("div");
  div.className="overlay";div.onclick=e=>{if(e.target===div)div.remove();};
  div.innerHTML=`<div class="pcard">
    <div class="pchead"><span class="flag">${t.flag}</span>
      <div><h3>${p.no?"#"+p.no+" ":""}${esc(p.name)} ${p.cap?'<span style="color:var(--gold)">©</span>':''}</h3>
      <div class="sub">${esc(t.team)} &middot; <span class="pos ${p.pos}">${p.pos}</span> ${p.tmPos?esc(p.tmPos):POSRO[p.pos]}</div></div></div>
    <div class="pcgrid">
      <div class="pcell" style="grid-column:1/3"><div class="k">Cotă de piață (Transfermarkt)</div>
        <div class="v big">${fmtMV(p.mv)}</div><div class="mvbigbar"><i style="width:${pct}%"></i></div></div>
      <div class="pcell"><div class="k">Vârstă</div><div class="v">${p.age} ani <span class="dimc">(${p.dob})</span></div></div>
      <div class="pcell"><div class="k">Club</div><div class="v" style="font-size:13.5px"><span class="flag">${p.ccFlag||""}</span> ${esc(p.club||"–")}</div></div>
      <div class="pcell"><div class="k">Selecții / Goluri</div><div class="v">${p.caps} / ${p.goals}</div></div>
      <div class="pcell"><div class="k">Înălțime / Picior</div><div class="v">${p.h?p.h+" m":"–"} / ${FOOTRO[p.foot]||"–"}</div></div>
    </div>
    <button class="pcclose" onclick="this.closest('.overlay').remove()">ÎNCHIDE</button>
  </div>`;
  document.body.appendChild(div);
}

if(WC26.results&&WC26.results.updated){
  const d=new Date(WC26.results.updated.replace(" ","T")+":00Z"); // UTC -> local
  document.getElementById("upd").textContent="ACTUALIZAT "+p2(d.getDate())+"."+p2(d.getMonth()+1)+" "+p2(d.getHours())+":"+p2(d.getMinutes());
}
render();
</script>
