<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC26 Manager · Cupa Mondială FIFA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1119; --panel:#171c29; --panel2:#1d2334; --panel3:#232b40; --line:#2a324a;
  --line:#272f47; --txt:#e9ecf5; --mut:#8d96b2; --dim:#5d6585;
  --acc:#7b61ff; --acc2:#9d8bff; --go:#33d97c; --warn:#f2a93b;
  --gk:#e8a838; --df:#4f9cf7; --mf:#3fce72; --fw:#f0566a;
  --r:10px; --sans:'Barlow Semi Condensed',system-ui,sans-serif; --disp:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#39425f var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:54px 1fr;height:100vh}
/* ---------- top bar ---------- */
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(180deg,#1b2133,#151a28);border-bottom:1px solid var(--line);z-index:30}
.brand{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.4px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .ball{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 20deg,var(--acc),#4a2fd1 40%,var(--acc2) 75%,var(--acc));display:grid;place-items:center;font-size:13px}
.brand small{color:var(--mut);font-weight:600;font-family:var(--sans);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.search{position:relative;flex:1;max-width:430px}
.search input{width:100%;background:#10141f;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:7px 12px 7px 34px;font:inherit;outline:none}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:11px;top:8px;color:var(--dim)}
.sres{position:absolute;top:40px;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:330px;overflow:auto;display:none;box-shadow:0 14px 34px #0009}
.sres.on{display:block}
.sres a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #1f2639}
.sres a:hover{background:var(--panel3)}
.sres .tag{margin-left:auto;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.spacer{flex:1}
.today{color:var(--mut);font-weight:600;font-size:13px;letter-spacing:.3px;white-space:nowrap}
.cont{background:linear-gradient(180deg,#3ce98c,#27c168);color:#06240f;font-weight:700;font-family:var(--disp);font-size:13px;letter-spacing:.4px;padding:9px 18px;border-radius:7px;box-shadow:0 2px 0 #168a45, inset 0 1px 0 #ffffff44;white-space:nowrap}
.cont:active{transform:translateY(1px);box-shadow:0 1px 0 #168a45}
/* ---------- sidebar ---------- */
.side{background:#131726;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--mut);font-weight:600;letter-spacing:.2px;border-left:3px solid transparent}
.nav svg{width:17px;height:17px;flex:none}
.nav:hover{background:#1a2031;color:var(--txt)}
.nav.on{background:linear-gradient(90deg,#2a2350,#1c2136);color:#fff;border-left-color:var(--acc)}
.side .sec{margin:14px 6px 5px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:700}
.gqueue{display:flex;flex-direction:column;gap:2px}
.gqueue a{display:flex;gap:8px;align-items:center;padding:5px 12px;border-radius:6px;color:var(--mut);font-size:13.5px;font-weight:600}
.gqueue a:hover{background:#1a2031;color:var(--txt)}
.gqueue b{color:var(--acc2);width:14px;font-family:var(--disp)}
.credit{margin-top:auto;padding:10px 8px 4px;font-size:11px;color:#454d6b;line-height:1.5}
/* ---------- main ---------- */
.main{overflow:auto;padding:20px 22px 60px;scroll-behavior:smooth}
.h1{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.3px;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:18px;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--acc2);font-weight:700;margin-bottom:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel .ph{padding:11px 15px;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:13.5px;letter-spacing:.6px;text-transform:uppercase;color:#cdd3e6;display:flex;align-items:center;gap:9px;background:#1a2031}
.grid{display:grid;gap:14px}
.flag{width:26px;height:18px;border-radius:3px;object-fit:cover;background:#222;box-shadow:0 0 0 1px #0007;flex:none}
.flag.s{width:21px;height:14px}
.flag.l{width:42px;height:29px;border-radius:4px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;background:#181e2e;position:sticky;top:0;z-index:2}
th.sort{cursor:pointer}th.sort:hover{color:var(--txt)}
th .arr{color:var(--acc2)}
td{padding:7px 12px;border-bottom:1px solid #1d2336;white-space:nowrap;font-weight:500}
tr.row{cursor:pointer}
tbody tr:nth-child(odd){background:#181d2c66}
tbody tr:hover{background:#222a4199}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{display:inline-grid;place-items:center;width:30px;height:19px;border-radius:4px;font-size:11.5px;font-weight:700;letter-spacing:.5px;color:#0b0e16}
.pos.GK{background:var(--gk)}.pos.DF{background:var(--df)}.pos.MF{background:var(--mf)}.pos.FW{background:var(--fw)}
.fm{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 4px;border-radius:4px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.fm.f1{background:#2b3247;color:#9aa3bf}.fm.f2{background:#5a5f2e;color:#e6e98a}.fm.f3{background:#2c6b3f;color:#8df2ae}.fm.f4{background:#118a45;color:#dbffe9}
.cptb{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;background:var(--warn);color:#241a04;font-size:10.5px;font-weight:800;margin-left:6px;vertical-align:1px}
.mutd{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:#1b2133;border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:#2c2358;border-color:var(--acc);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input.f{background:#10141f;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:7px 10px;font:inherit;outline:none}
select:focus,input.f:focus{border-color:var(--acc)}
/* group cards */
.groups{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.gcard .ph b{color:var(--acc2);font-size:15px}
.gcard a{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #1d2336;font-weight:600}
.gcard a:last-child{border-bottom:none}
.gcard a:hover{background:var(--panel3)}
.gcard .rk{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.hostb{font-size:9.5px;background:#2c2358;color:var(--acc2);border:1px solid var(--acc);padding:1px 6px;border-radius:99px;letter-spacing:1px;font-weight:700}
/* team header */
.thead{display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,#241f4d 0%,#1a2033 55%,#171c29 100%);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;flex-wrap:wrap}
.crest{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 4px 10px #0008)}
.thead h2{font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:.3px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tmeta{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
.tmeta div b{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:1px}
.tmeta div span{font-weight:600;font-size:15px}
.rankbig{margin-left:auto;text-align:center;background:#10141fcc;border:1px solid var(--line);border-radius:10px;padding:10px 18px}
.rankbig b{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--acc2)}
.rankbig span{display:block;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:700}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 18px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--go)}
.tab:hover{color:var(--txt)}
.cols2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.kv{padding:12px 15px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv b{color:var(--dim);font-weight:600}
.note{padding:13px 15px;color:#c4cade;font-size:14.2px;line-height:1.6}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #1d2336;font-weight:600}
.mrow:last-child{border:none}
.mrow .vs{color:var(--dim);font-weight:700;font-size:12px}
.mrow .when{margin-left:auto;text-align:right;color:var(--mut);font-size:12.5px;font-weight:500;line-height:1.3}
.mrow .tn{display:flex;align-items:center;gap:7px;min-width:0}
.mrow .tn span{overflow:hidden;text-overflow:ellipsis}
/* leaders */
.lead{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid #1d2336;cursor:pointer}
.lrow:hover{background:var(--panel3)}
.lrow:last-child{border:none}
.lrow .i{width:18px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.lrow .v{margin-left:auto;font-family:var(--disp);font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.lrow .c{color:var(--dim);font-size:12px}
/* venues */
.vens{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.ven{padding:15px}
.ven h3{font-family:var(--disp);font-size:16px;font-weight:700;margin-bottom:2px}
.ven .ci{color:var(--mut);font-size:13px;margin-bottom:10px}
.bar{height:7px;border-radius:99px;background:#10141f;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.ven .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
/* matches page */
.dhead{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.5px;color:#cdd3e6;margin:20px 0 8px;display:flex;gap:10px;align-items:baseline}
.dhead small{color:var(--dim);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-size:10.5px}
.stg{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:#10141f;border:1px solid var(--line);padding:2px 8px;border-radius:99px;font-weight:700}
/* modal */
.ov{position:fixed;inset:0;background:#080a11cc;backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:20px}
.ov.on{display:grid}
.pcard{width:min(740px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #343e63;border-radius:14px;box-shadow:0 30px 80px #000c}
.phead{display:flex;gap:16px;align-items:center;padding:18px 20px;background:linear-gradient(120deg,#2a2358,#1b2133);border-bottom:1px solid var(--line);position:relative}
.ava{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#39425f,#202741);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:21px;color:#aeb8da;flex:none;box-shadow:inset 0 0 0 2px #ffffff14}
.phead h3{font-family:var(--disp);font-weight:800;font-size:22px}
.phead .x{position:absolute;top:10px;right:12px;color:var(--mut);font-size:20px;padding:4px 8px;border-radius:6px}
.phead .x:hover{background:#ffffff14;color:#fff}
.pbody{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:18px 20px}
.pitch{background:linear-gradient(180deg,#173a26,#10301d);border:1px solid #2c5a3d;border-radius:10px;position:relative;height:238px}
.pitch:before,.pitch:after{content:"";position:absolute;left:10%;right:10%;height:16%;border:1.5px solid #ffffff2e;border-bottom:none;top:0}
.pitch:after{top:auto;bottom:0;border-bottom:1.5px solid #ffffff2e;border-top:none}
.pitch .mid{position:absolute;left:0;right:0;top:50%;border-top:1.5px solid #ffffff2e}
.pitch .cc{position:absolute;left:50%;top:50%;width:42px;height:42px;border:1.5px solid #ffffff2e;border-radius:50%;transform:translate(-50%,-50%)}
.dot{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b0e16;box-shadow:0 0 0 4px #ffffff1f,0 4px 12px #000a}
.pstats{display:grid;gap:11px;align-content:start}
.pst b{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:4px}
.pst b span{color:var(--txt);font-family:var(--disp);font-size:14px;letter-spacing:0}
.pinfo{grid-column:1/3;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 20px 20px}
.pi{background:#10141f;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.pi b{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:2px}
.pi span{font-weight:600;font-size:14.5px}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.hl{color:var(--go);font-weight:700}
.empty{padding:26px;text-align:center;color:var(--dim)}
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:54px;bottom:0;width:212px;transform:translateX(-100%);transition:transform .2s;z-index:40}
  .side.open{transform:none;box-shadow:20px 0 50px #000a}
  .burger{display:grid!important}
  .cols2,.pbody{grid-template-columns:1fr}
  .today{display:none}
  .pitch{height:200px}
}
.burger{display:none;place-items:center;width:36px;height:36px;border-radius:8px;background:#10141f;border:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
</style>
</head>

<div class="app">
  <header class="top">
    <button class="burger" id="burger" aria-label="Meniu">≡</button>
    <a class="brand" href="#/"><span class="ball">⚽</span>WC26 <small>Manager</small></a>

    <a class="nav" data-r="venues" href="#/venues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="6"/><ellipse cx="12" cy="12" rx="4" ry="2.4"/></svg>Stadioane</a>

    <div class="sec">Grupe</div>
    <div class="gqueue" id="gq"></div>
    <div class="credit">Date: FIFA via proiecte open-source (emrbli/worldcup, openfootball · CC0) și Wikipedia (CC BY-SA).<br>Loturi finale · 11 iun 2026. Rezultatele nu se actualizează live.</div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

function squadTable(players,opts={}){
  const cols=[['no','#','num'],['n','Jucător',''],['p','Poz',''],['a','Vârstă','num'],['c','Club','']];
  if(opts.team)cols.splice(1,0,['tn','Echipă','']);
  cols.push(['cp','Sel','num'],['g','Goluri','num']);
  const st=opts.state;
  const arrow=k=>st.k===k?`<span class="arr">${st.d>0?'▲':'▼'}</span>`:'';
  let rows=[...players];
  rows.sort((a,b)=>{let va=a[st.k],vb=b[st.k];if(va==null)return 1;if(vb==null)return -1;
    if(typeof va==='string')return st.d*va.localeCompare(vb,'ro');return st.d*(va-vb)});
  const body=rows.map(p=>`<tr class="row" onclick="openPid('${esc(pidOf(p)).replace(/'/g,"\\'")}')">
    <td class="num mutd">${p.no??'–'}</td>
    ${opts.team?`<td><span style="display:inline-flex;align-items:center;gap:7px">${flag(p.iso,'s')}${esc(p.team)}</span></td>`:''}
    <td><b>${esc(p.n)}</b>${p.cap?'<span class="cptb" title="Căpitan">C</span>':''}</td>
    <td><span class="pos ${p.p}">${p.p}</span></td>
    <td class="num">${p.a??'–'}</td>
    <td class="mutd">${esc(p.c??'–')}</td>

  return `<table><thead><tr>${cols.map(([k,l,c])=>`<th class="sort ${c}" data-k="${k}">${l} ${arrow(k)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}

    for(const lm of j.matches){let t1=lm.team1,t2=lm.team2;
      if(t1&&t1.name)t1=t1.name;if(t2&&t2.name)t2=t2.name;
      const c1=N2C[t1],c2=N2C[t2],ft=lm.score&&lm.score.ft;
      if(ft&&c1&&c2)out.push({h:c1,a:c2,hs:ft[0],as:ft[1],d:lm.date,
        gh:(lm.goals1||[]).map(g=>[g.name,g.minute]),ga:(lm.goals2||[]).map(g=>[g.name,g.minute])})}
    if(out.length>=LIVE.results.length){LIVE.results=out;LIVE.fetched=new Date().toISOString().slice(0,10);buildLive();route()}
    if(btn){btn.textContent='✓ '+out.length+' rezultate'}}
  catch(e){if(btn)btn.textContent='↻ offline'}
  finally{if(btn){btn.disabled=false;setTimeout(()=>btn.textContent='↻ Scoruri',2500)}}}

/* ---------- îmbogățire Wikidata (poziții exacte + poze) ---------- */
const ENR_KEY='wc26m_enr_v2';
function applyEnr(map){let n=0;for(const k in map){const e=map[k];
  ENR[k]={fm:e.l?toksToFM(e.l.map(lbl2tok).filter(Boolean)):[],img:e.i||null};n++}return n}
async function enrich(){
  try{const c=localStorage.getItem(ENR_KEY);
    if(c){applyEnr(JSON.parse(c));setEnrStatus('done');route();return}}catch(e){}
  const names=PL.map(p=>p.n);const store={};
  setEnrStatus('loading');
  for(let i=0;i<names.length;i+=170){
    const batch=names.slice(i,i+170);
    const vals=batch.map(n=>'<https://en.wikipedia.org/wiki/'+encodeURIComponent(n.replace(/ /g,'_')).replace(/'/g,'%27')+'>').join(' ');
    const q=`SELECT ?art ?posLabel ?img WHERE{VALUES ?art{${vals}} ?art schema:about ?p. OPTIONAL{?p wdt:P413 ?pos.} OPTIONAL{?p wdt:P18 ?img.} SERVICE wikibase:label{bd:serviceParam wikibase:language "en".}}`;
    try{const r=await fetch('https://query.wikidata.org/sparql',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/sparql-results+json'},
      body:'query='+encodeURIComponent(q)});
      const j=await r.json();
      for(const row of j.results.bindings){
        const name=decodeURIComponent(row.art.value.split('/wiki/')[1]).replace(/_/g,' ');
        const o=store[name]=store[name]||{l:[],i:null};
        if(row.posLabel&&!o.l.includes(row.posLabel.value))o.l.push(row.posLabel.value);
        if(row.img&&!o.i)o.i=decodeURIComponent(row.img.value.split('/').pop());}
      setEnrStatus('loading',Math.min(99,Math.round((i+170)/names.length*100)));}
    catch(e){setEnrStatus('offline');return}}
  applyEnr(store);
  try{localStorage.setItem(ENR_KEY,JSON.stringify(store))}catch(e){}
  setEnrStatus('done');route()}
function setEnrStatus(s,pct){const el=document.getElementById('enrst');if(!el)return;
  el.style.display='inline-flex';
  if(s==='loading')el.innerHTML='⟳ Poziții & poze: '+(pct||0)+'%';
  else if(s==='done'){el.innerHTML='✓ Profiluri complete';setTimeout(()=>el.style.display='none',3000)}
  else el.innerHTML='Profiluri detaliate indisponibile offline'}

      <td class="pz">${i+1}</td><td><span style="display:inline-flex;align-items:center;gap:8px;font-weight:700">${flag(s.t.iso,'s')}${esc(s.t.name)}</span></td>
      <td class="num">${s.m}</td><td class="num">${s.v}</td><td class="num">${s.e}</td><td class="num">${s.i}</td>
      <td class="num">${s.gm}</td><td class="num">${s.gp}</td><td class="num">${s.gm-s.gp>0?'+':''}${s.gm-s.gp}</td><td class="num"><b style="color:var(--acc2)">${s.pt}</b></td></tr>`).join('')}
  </tbody></table>
  <div class="estnote" style="border:none">■ verde — calificare directă (primele 2) · ■ galben — posibil calificată ca una dintre cele mai bune 8 de pe locul 3.</div>`;
  return `<div class="eyebrow">Faza grupelor · CM 2026</div><div class="h1">Grupa ${g}</div>
  <div class="sub">${st.map(s=>s.t.name).join(' · ')}</div>
  <div class="cols2">
    <div style="display:grid;gap:14px">
      <div class="panel"><div class="ph">Clasament</div><div style="overflow:auto">${tbl}</div></div>
      ${played.length?`<div class="panel"><div class="ph">Rezultate</div>${played.map(m=>{const r=resOf(m);
        const gl=[...r.gh.map(([n,mi])=>scorerHTML(m.h,n)+` ${esc(mi)}'`),...r.ga.map(([n,mi])=>scorerHTML(m.a,n)+` ${esc(mi)}' <span class="mutd">(${esc(m.a)})</span>`)].join(' · ');
        return mRow2(m)+(gl?`<div style="padding:0 14px 9px;font-size:12.5px;color:var(--mut)">⚽ ${gl}</div>`:'')}).join('')}</div>`:''}
    </div>
    <div style="display:grid;gap:14px">
      <div class="panel"><div class="ph">Program</div>${upcoming.map(mRow2).join('')||'<div class="empty">Toate meciurile s-au jucat.</div>'}</div>
      ${sc.length?`<div class="panel"><div class="ph">Golgheterii grupei</div>${sc.map((x,i)=>`<div class="lrow" style="cursor:default"><span class="i">${i+1}</span>${flag(byCode[x.c].iso,'s')}<span><b>${scorerHTML(x.c,x.n)}</b><br><span class="c">${esc(byCode[x.c].name)}</span></span><span class="v">${x.v} ⚽</span></div>`).join('')}</div>`:''}
      <div class="panel"><div class="ph">Loturi — valoare*</div>${[...st].sort((a,b)=>b.t.val-a.t.val).map((s,i)=>`<a class="lrow" href="#/team/${s.t.code}"><span class="i">${i+1}</span>${flag(s.t.iso,'s')}<span><b>${esc(s.t.name)}</b><br><span class="c">FIFA #${s.t.rank??'–'}</span></span><span class="v">${fmtV(s.t.val)}</span></a>`).join('')}</div>
    </div>
  </div>`};
/* ---------- meciuri / stadioane / acasă / clasamente v2 ---------- */
V.matches=function(){let cur='';
  const stages=['group','r32','r16','qf','sf','third','final'];
  const chips=`<div class="chips">${stages.map(s=>`<button class="chip" onclick="document.getElementById('st-${s}')?.scrollIntoView({block:'start'})">${STG[s]}</button>`).join('')}</div>`;
  const list=DATA.matches.map((m,ix)=>{const k=dayKey(m.ko);let h='';
    if(k!==cur){cur=k;const firstStage=DATA.matches.find(x=>x.stage===m.stage)===m;
      h=`${ix?'</div>':''}<div class="dhead" ${firstStage?`id="st-${m.stage}"`:''}>${k}<small>${STG[m.stage]}</small></div><div class="panel">`}
    return h+mRow2(m)}).join('')+'</div>';
  return `<div class="h1">Calendarul complet</div><div class="sub">104 meciuri · orele în fusul tău orar · click pe orice meci pentru detalii, marcatori și istoricul direct.</div>${chips}${list}`};
V.venues=function(){const max=Math.max(...DATA.venues.map(v=>v.cap));
  return `<div class="h1">Stadioane</div><div class="sub">16 arene în trei țări — cel mai mare turneu din istorie. Fotografii: Wikimedia Commons.</div>
  <div class="grid vens">${DATA.venues.map(v=>`<div class="panel">
    ${v.img?`<img class="vphoto" loading="lazy" src="${commonsThumb(v.img,520)}" alt="${esc(v.name)}" onerror="this.remove()">`:''}
    <div class="ven"><h3>${esc(v.name)}</h3><div class="ci">${esc(v.city)}, ${esc(v.country)}</div>
    <div class="bar"><i style="width:${Math.round(v.cap/max*100)}%"></i></div>
    <div class="cap"><span>Capacitate</span><b>${num(v.cap)}</b></div></div></div>`).join('')}</div>`};
V.home=function(){const now=new Date();
  const todays=DATA.matches.filter(m=>koDate(m.ko).toDateString()===now.toDateString());
  const upcoming=todays.length?todays:DATA.matches.filter(m=>koDate(m.ko)>now).slice(0,4);
  const tsc=Object.entries(SCORERS).map(([k,v])=>{const[c,n]=k.split('|');return{c,n,v}}).sort((a,b)=>b.v-a.v).slice(0,8);
  const topCaps=[...PL].filter(p=>p.cp!=null).sort((a,b)=>b.cp-a.cp).slice(0,8);
  const topVal=[...PL].sort((a,b)=>(b.v||0)-(a.v||0)).slice(0,8);
  const lrow=(arr,vf)=>arr.map((p,i)=>`<div class="lrow" onclick="openPid('${esc(pidOf(p)).replace(/'/g,"\\'")}')"><span class="i">${i+1}</span>${pAva(p,28)}<span><b>${esc(p.n)}</b><br><span class="c">${esc(p.tn)} · ${esc(fmStr(fmOf(p)))}</span></span><span class="v">${vf(p)}</span></div>`).join('');
  return `<div class="eyebrow">Canada · Mexic · SUA — 11 iunie → 19 iulie 2026</div>
  <div class="h1">Cupa Mondială FIFA 2026</div>
  <div class="sub">48 de echipe · ${num(PL.length)} jucători · 104 meciuri pe 16 stadioane. Scoruri actualizate: ${LIVE.fetched||'–'} (butonul ↻ din bară).</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
    <div class="panel"><div class="ph">⚽ ${todays.length?'Meciurile de azi':'Următoarele meciuri'}</div>
      ${upcoming.map(mRow2).join('')||'<div class="empty">–</div>'}
      <div style="padding:10px 14px"><a class="chip" href="#/matches">Tot programul →</a></div></div>
    ${tsc.length?`<div class="panel"><div class="ph">🏆 Golgheterii turneului</div>${tsc.map((x,i)=>`<div class="lrow" style="cursor:default"><span class="i">${i+1}</span>${flag(byCode[x.c].iso,'s')}<span><b>${scorerHTML(x.c,x.n)}</b><br><span class="c">${esc(byCode[x.c].name)}</span></span><span class="v">${x.v} ⚽</span></div>`).join('')}</div>`:''}
    <div class="panel"><div class="ph">💎 Cei mai valoroși* jucători</div>${lrow(topVal,p=>fmtV(p.v))}</div>
    <div class="panel"><div class="ph">🏅 Cele mai multe selecții</div>${lrow(topCaps,p=>p.cp)}</div>
  </div>
  <div class="dhead" style="margin-top:26px">Grupele <small>click pe litera grupei pentru clasament & rezultate</small></div>
  ${V.teams(true)}`};
const _leaders1=V.leaders;
V.leaders=function(){const trow=(arr)=>arr.map(([t,v],i)=>`<a class="lrow" href="#/team/${t.code}"><span class="i">${i+1}</span>${flag(t.iso,'s')}<span><b>${esc(t.name)}</b></span><span class="v">${v}</span></a>`).join('');
  const lrow=(arr,vf)=>arr.map((p,i)=>`<div class="lrow" onclick="openPid('${esc(pidOf(p)).replace(/'/g,"\\'")}')"><span class="i">${i+1}</span>${pAva(p,28)}<span><b>${esc(p.n)}</b><br><span class="c">${esc(p.tn)} · ${esc(p.c||'')}</span></span><span class="v">${vf(p)}</span></div>`).join('');
  const topVal=[...PL].sort((a,b)=>(b.v||0)-(a.v||0)).slice(0,12);
  const valT=T.map(t=>[t,fmtV(t.val)]).sort((a,b)=>b[0].val-a[0].val).slice(0,12);
  return _leaders1()+`<div class="grid lead" style="margin-top:14px">
    <div class="panel"><div class="ph">💎 Top valori de piață* — jucători</div>${lrow(topVal,p=>fmtV(p.v))}<div class="estnote">* estimare model WC26M — nu Transfermarkt.</div></div>
    <div class="panel"><div class="ph">💰 Cele mai valoroase loturi*</div>${trow(valT)}</div></div>`};
/* ---------- bara de sus + kickoff ---------- */
$('#contBtn').insertAdjacentHTML('beforebegin',`<span id="enrst"></span><button class="iref" id="refBtn" title="Actualizează scorurile din openfootball (necesită internet)">↻ Scoruri</button>`);
$('#refBtn').onclick=()=>refreshLive($('#refBtn'));
$('.credit').innerHTML=`Date: FIFA via open-source (emrbli/worldcup · openfootball CC0), Wikipedia/Wikidata (CC BY-SA), rezultate live: openfootball. Poze: FIFA / Wikimedia Commons.<br><b>Valorile de piață sunt estimări</b> (model propriu), nu Transfermarkt.`;
route();
refreshLive(null);
enrich();
</script>
