// a doua incarcare, deci nu exista bucla nici daca sessionStorage este indisponibil.

</script>

const TAG="aeZLzSBs56iToDRLlzz4oYr9GL/CSChqvZzOh6gVyS8=";
// Credentialele salvate pentru un blob vechi nu trebuie incercate pe cheia noua.
const LEGACY_SS="wc26pw";
const SS="wc26pw:"+TAG.slice(0,16);
function b64bytes(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function concat(a,b){const out=new Uint8Array(a.length+b.length);out.set(a);out.set(b,a.length);return out;}
async function decrypt(pw){
  const data=b64bytes(B64);
  const magic=new TextDecoder().decode(data.slice(0,8));
  if(magic!=="Salted__") throw new Error("format");
  const salt=data.slice(8,16), ct=data.slice(16);
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  // Encrypt-then-MAC: autentificam header+salt+ciphertext INAINTE de decryptare.
  const macBits=await crypto.subtle.deriveBits(
      {name:"PBKDF2",salt:concat(salt,enc.encode("wc26-hmac-v1")),iterations:ITER,hash:"SHA-256"},km,256);
  const macKey=await crypto.subtle.importKey("raw",macBits,{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  if(!await crypto.subtle.verify("HMAC",macKey,b64bytes(TAG),data)) throw new Error("auth");
  const bits=new Uint8Array(await crypto.subtle.deriveBits(
      {name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,384)); // 48 bytes
  const key=await crypto.subtle.importKey("raw",bits.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,ct);
  return new TextDecoder("utf-8").decode(pt);
}
async function reveal(pw,remember){
  const html=await decrypt(pw);            // arunca daca parola e gresita (padding invalid)
  if(remember){try{sessionStorage.removeItem(LEGACY_SS);sessionStorage.setItem(SS,pw);}catch(e){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err");err.textContent="";
  try{ await reveal(document.getElementById("pw").value.trim(),true); }
  catch(ex){
    try{sessionStorage.removeItem(SS);sessionStorage.removeItem(LEGACY_SS);}catch(_){}
    err.textContent=(ex&&ex.message==="auth")
      ?"Parol\u0103 gre\u0219it\u0103 sau veche. Folose\u0219te parola curent\u0103."
      :"Eroare de decriptare. Reincarca pagina.";
  }
});
// reload in aceeasi sesiune (telefon, verificare rapida) -> nu re-cere parola
